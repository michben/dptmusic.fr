</head><body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="DPT — Accueil">
        <!-- LOGO : à changer depuis /admin/ (onglet « Images »), ou en remplaçant assets/img/logo.png -->
        <img src="assets/img/logo.png" alt="DPT" width="413" height="166" data-logo>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Ouvrir le menu"><span></span></button>
      <nav id="site-nav" class="nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="music.html" aria-current="page">Musique</a>
        <a href="vote.html">Vote</a>
        <a href="about.html">À propos</a>
        <a href="contact.html">Contact</a>
        <!-- Bouton « Écouter » : le lien se règle dans assets/data/site.json (listenLink) -->
        <a class="btn btn-primary btn-sm" href="https://ditto.fm/dpt-dpt" data-listen>Écouter</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow reveal">Discographie</span>
        <h1 class="page-title reveal">Musique</h1>
        <p class="lead reveal reveal-2">Tous les morceaux de DPT et leurs liens d’écoute officiels.</p>
      </div>
    </section>

    <section class="section" style="padding-top:1rem" aria-label="Liste des morceaux">
      <div class="container">
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filtrer les sorties">
            <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">Tous</button>
            <button class="filter-btn" type="button" data-filter="out" aria-pressed="false">En écoute</button>
            <button class="filter-btn" type="button" data-filter="soon" aria-pressed="false">À venir</button>
            <button class="filter-btn" type="button" data-filter="single" aria-pressed="false">Singles</button>
            <button class="filter-btn" type="button" data-filter="ep" aria-pressed="false">EP</button>
            <button class="filter-btn" type="button" data-filter="album" aria-pressed="false">Albums</button>
            <button class="filter-btn" type="button" data-filter="featuring" aria-pressed="false">Featurings</button>
          </div>
          <div class="search">
            <label class="visually-hidden" for="track-search">Rechercher un titre</label>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input id="track-search" type="search" placeholder="Rechercher un titre" autocomplete="off">
          </div>
        </div>
        <p class="visually-hidden" data-count aria-live="polite"></p>
        <!-- Les cartes sont générées automatiquement depuis assets/data/tracks.json : inutile de modifier ce fichier pour ajouter un morceau. -->
        <div class="tracks-grid" data-discography></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <!-- Réseaux sociaux : liens à renseigner dans assets/data/site.json (socials). Les liens vides ne s'affichent pas. -->
      <ul class="socials" data-socials aria-label="DPT sur les réseaux"></ul>
      <div class="footer-grid">
        <p>&copy; <span data-year>2026</span> DPT. Tous droits réservés.</p>
        <ul class="footer-links">
          <li><a href="music.html">Musique</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="mentions-legales.html">Mentions légales</a></li>
        </ul>
      </div>
    </div>
  </footer>
</body>
</html>
