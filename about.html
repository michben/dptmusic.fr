</head><body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="DPT — Accueil">
        <!-- LOGO : à changer depuis /admin/ (onglet « Images »), ou en remplaçant assets/img/logo.png -->
        <img src="assets/img/logo.png" alt="DPT" width="413" height="166" data-logo>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Ouvrir le menu"><span></span></button>
      <nav id="site-nav" class="nav" aria-label="Navigation principale">
        <a href="index.html">Accueil</a>
        <a href="music.html">Musique</a>
        <a href="vote.html">Vote</a>
        <a href="about.html" aria-current="page">À propos</a>
        <a href="contact.html">Contact</a>
        <!-- Bouton « Écouter » : le lien se règle dans assets/data/site.json (listenLink) -->
        <a class="btn btn-primary btn-sm" href="https://ditto.fm/dpt-dpt" data-listen>Écouter</a>
      </nav>
    </div>
  </header>

  <main id="contenu">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow reveal">L’artiste</span>
        <h1 class="page-title reveal">À propos</h1>
        <!-- Tous les textes de cette page se saisissent dans /admin/ (onglet « Textes du site »).
             Un texte vide masque le bloc correspondant. -->
        <div class="lead reveal reveal-2" data-block data-about-intro hidden></div>
      </div>
    </section>

    <section class="section" style="padding-top:1rem">
      <div class="container about-grid">
        <div class="about-photo">
          <!-- PHOTO : à changer depuis /admin/ (onglet « Images », « Photo de la page À propos »).
               Sans photo dédiée, c'est la photo officielle qui s'affiche. -->
          <img src="assets/img/artist.jpg" alt="Portrait de l’artiste DPT" width="1200" height="1200" loading="lazy" data-about-photo>
        </div>

        <div>
          <p class="empty-state" data-if-no-about hidden>Les textes de cette page arrivent bientôt.</p>

          <div class="about-block" data-block hidden>
            <h2>Biographie</h2>
            <div data-about-bio></div>
          </div>

          <div class="about-block" data-block hidden>
            <h2>Univers musical</h2>
            <div data-about-universe></div>
          </div>

          <div class="about-block" data-block hidden>
            <h2>Influences</h2>
            <div data-about-influences></div>
          </div>

          <blockquote class="signature" data-block hidden>
            <div data-about-quote></div>
          </blockquote>

          <div class="hero-actions">
            <a class="btn btn-primary" href="https://ditto.fm/dpt-dpt" data-listen>Écouter la musique</a>
            <a class="btn btn-ghost" href="contact.html">Contacter DPT</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <!-- Réseaux sociaux : liens à renseigner dans assets/data/site.json (socials). Les liens vides ne s'affichent pas. -->
      <ul class="socials" data-socials aria-label="DPT sur les réseaux"></ul>
      <div class="footer-grid">
        <p>&copy; <span data-year>2026</span> DPT. Tous droits réservés.</p>
        <ul class="footer-links">
          <li><a href="music.html">Musique</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="mentions-legales.html">Mentions légales</a></li>
        </ul>
      </div>
    </div>
  </footer>
</body>
</html>
